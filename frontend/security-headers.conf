# nginx's add_header does not inherit into a location block that sets its
# own add_header (e.g. Cache-Control) — it replaces the whole set instead of
# merging. So this file is `include`d in every location, not just the
# server block, to keep these headers on every response.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

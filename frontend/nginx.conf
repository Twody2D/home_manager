# Shared across worker processes, keyed by client IP. 10r/s with a burst of
# 20 comfortably covers normal app usage (page load fans out several XHRs at
# once) while still capping abusive/scripted traffic before it reaches the
# backend's own per-endpoint login throttle.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HSTS is only meaningful once this is served over HTTPS (behind TLS
    # termination in production) — enable it there, not for local HTTP dev.

    client_max_body_size 1m;

    location /api/ {
        include security-headers.conf;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /health/edge {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Vite fingerprints these filenames by content hash, so they can be
    # cached forever — a changed file always gets a new URL.
    location /assets/ {
        include security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /icons/ {
        include security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker, its registration script, and the manifest are NOT
    # fingerprinted — they must be revalidated on every load, or PWA updates
    # would never reach installed clients.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        include security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
